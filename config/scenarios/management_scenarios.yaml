        event_type: farmyard_manure
        simulation_month: 9
        amount: 1.0
        units: t_C_ha^-1
        cost_gbp_ha: 80.0
        emissions_proxy_kg_co2e_ha: 35.0
        parameter_provenance: A011 established RothC carbon routing plus A026 provisional P content; cost/emissions are uncalibrated scenario accounting.
        source_classification: scenario_assumption
        provenance: Demonstration amount and timing, not a recommendation.
