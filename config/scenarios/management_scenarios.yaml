policies:
  - policy_id: baseline
    name: No scheduled Phase 6 intervention
    events: []
    classification: scenario_assumption
    provenance: Comparator retaining the Phase 5 process configuration.
  - policy_id: conventional_tillage
    name: Conventional tillage
    classification: scenario_assumption
    provenance: Provisional tillage direction scenario; not calibrated.
    events:
      - &conventional
        event_id: conventional-2026
        event_type: tillage
        event_date: 2026-03-15
        amount: 1.0
        units: operation_ha^-1
        parameters: [{name: tillage_level, value: conventional}]
        cost_gbp_ha: 70.0
        emissions_proxy_kg_co2e_ha: 25.0
        parameter_provenance: A009 provisional effect parameters in model_defaults.yaml; cost/emissions are uncalibrated scenario accounting.
        source_classification: scenario_assumption
        provenance: Demonstration schedule, not an agronomic recommendation.
      - {<<: *conventional, event_id: conventional-2027, event_date: null, simulation_month: 14}
  - policy_id: reduced_tillage
    name: Reduced tillage
    classification: scenario_assumption
    provenance: Provisional tillage direction scenario; not calibrated.
    events:
      - &reduced
        event_id: reduced-2026
        event_type: tillage
        simulation_month: 2
        amount: 1.0
        units: operation_ha^-1
        parameters: [{name: tillage_level, value: reduced}]
        cost_gbp_ha: 45.0
        emissions_proxy_kg_co2e_ha: 15.0
        parameter_provenance: A009 provisional effect parameters in model_defaults.yaml; cost/emissions are uncalibrated scenario accounting.
        source_classification: scenario_assumption
        provenance: Demonstration schedule, not an agronomic recommendation.
      - {<<: *reduced, event_id: reduced-2027, simulation_month: 14}
  - policy_id: no_till
    name: No-till operation marker
    classification: scenario_assumption
    provenance: Explicit configured null-disturbance endpoint.
    events:
      - event_id: no-till-2026
        event_type: tillage
        simulation_month: 2
        amount: 1.0
        units: operation_ha^-1
        parameters: [{name: tillage_level, value: no_till}]
        cost_gbp_ha: 25.0
        emissions_proxy_kg_co2e_ha: 8.0
        parameter_provenance: A009 explicit no-effect defaults; cost/emissions are uncalibrated scenario accounting.
        source_classification: scenario_assumption
        provenance: Demonstration schedule, not an agronomic recommendation.
  - policy_id: cover_crop
    name: AMF-compatible seasonal cover crop
    classification: scenario_assumption
    provenance: Generic deterministic AM-compatible cover; no establishment benefit is guaranteed.
    events:
      - event_id: cover-establish-2026
        event_type: cover_crop_establishment
        simulation_month: 8
        amount: 1.0
        units: event
        cost_gbp_ha: 60.0
        emissions_proxy_kg_co2e_ha: 12.0
        parameter_provenance: A010 provisional generic cover-crop parameters in model_defaults.yaml.
        source_classification: scenario_assumption
        provenance: Demonstration seasonal schedule.
      - event_id: cover-terminate-2027
        event_type: cover_crop_termination
        simulation_month: 13
        amount: 1.0
        units: event
        cost_gbp_ha: 35.0
        emissions_proxy_kg_co2e_ha: 10.0
        parameter_provenance: A010 provisional generic residue/P return parameters in model_defaults.yaml.
        source_classification: scenario_assumption
        provenance: Demonstration seasonal schedule.
  - policy_id: phosphorus
    name: Available-phosphorus application
    classification: scenario_assumption
    provenance: Explicit available-P addition; no fertiliser chemistry is represented.
    events:
      - event_id: phosphorus-2026
        event_type: phosphorus_application
        simulation_month: 2
        amount: 20.0
        units: kg_P_ha^-1
        cost_gbp_ha: 30.0
        emissions_proxy_kg_co2e_ha: 20.0
        parameter_provenance: Phase 6 exact stock addition; cost/emissions are uncalibrated scenario accounting.
        source_classification: scenario_assumption
        provenance: Demonstration amount and timing, not a recommendation.
  - policy_id: farmyard_manure
    name: Farmyard manure carbon and phosphorus input
    classification: scenario_assumption
    provenance: RothC 49/49/2 carbon routing with provisional explicit P content.
    events:
