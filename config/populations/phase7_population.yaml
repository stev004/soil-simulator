phosphorus_log_sd: {name: phosphorus_log_sd, default: 0.18, min: 0.0, max: 0.50, unit: log_ratio, classification: scenario_assumption, distribution: lognormal_bounded, source_citation: A033 bounded perturbation contract, notes: Positive available-P perturbation coupled to management intensity., version_introduced: 0.7.0}
