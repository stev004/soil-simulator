simulation_horizons_months: [24, 60, 120]

# Every weight and threshold below is a synthetic scenario choice, not an
# agronomic recommendation. Carbon objective weights are split equally across
# the frozen 5-year and 10-year predictors unless shown otherwise.
utility_profiles:
  - profile_id: yield_priority
    description: Synthetic preference scenario that places most weight on the 24-month yield effect.
    weights:
      yield_effect: 0.55
      total_soc_effect: 0.15
      protected_soc_proxy_effect: 0.10
      intervention_cost: 0.10
      emissions_proxy: 0.10
    constraints:
      maximum_yield_loss_t_dm_ha: 0.25
      maximum_cost_gbp_ha: 150.0
      maximum_emissions_proxy_kg_co2e_ha: 35.0
      minimum_total_soc_benefit_t_c_ha: 0.0
      maximum_actual_violation_rate: 0.02
    carbon_horizon_weights: [0.65, 0.35]
    classification: scenario_assumption
    provenance: Phase 9 synthetic preference scenario; not an agronomic recommendation.
  - profile_id: carbon_priority
    description: Synthetic preference scenario that places most weight on total and protected-SOC-proxy effects.
    weights:
      yield_effect: 0.15
      total_soc_effect: 0.35
      protected_soc_proxy_effect: 0.35
      intervention_cost: 0.075
      emissions_proxy: 0.075
    constraints:
      maximum_yield_loss_t_dm_ha: 0.50
      maximum_cost_gbp_ha: 150.0
      maximum_emissions_proxy_kg_co2e_ha: 35.0
      minimum_total_soc_benefit_t_c_ha: 0.0
      maximum_actual_violation_rate: 0.02
    carbon_horizon_weights: [0.35, 0.65]
    classification: scenario_assumption
    provenance: Phase 9 synthetic preference scenario; protected SOC is a model proxy, not measured MAOC.
  - profile_id: balanced
    description: Synthetic preference scenario with visible weight on every objective.
    weights:
      yield_effect: 0.25
      total_soc_effect: 0.25
      protected_soc_proxy_effect: 0.20
      intervention_cost: 0.15
      emissions_proxy: 0.15
    constraints:
      maximum_yield_loss_t_dm_ha: 0.30
      maximum_cost_gbp_ha: 100.0
      maximum_emissions_proxy_kg_co2e_ha: 35.0
      minimum_total_soc_benefit_t_c_ha: 0.0
      maximum_actual_violation_rate: 0.02
    carbon_horizon_weights: [0.50, 0.50]
    classification: scenario_assumption
    provenance: Phase 9 synthetic preference scenario; not an agronomic recommendation.
  - profile_id: cost_emissions_constrained
    description: Synthetic preference scenario with tighter cost and emissions limits.
    weights:
      yield_effect: 0.20
      total_soc_effect: 0.15
      protected_soc_proxy_effect: 0.10
      intervention_cost: 0.275
      emissions_proxy: 0.275
    constraints:
      maximum_yield_loss_t_dm_ha: 0.20
      maximum_cost_gbp_ha: 60.0
      maximum_emissions_proxy_kg_co2e_ha: 20.0
      minimum_total_soc_benefit_t_c_ha: 0.0
      maximum_actual_violation_rate: 0.02
    carbon_horizon_weights: [0.60, 0.40]
    classification: scenario_assumption
    provenance: Phase 9 synthetic preference scenario; thresholds are benchmark choices only.

