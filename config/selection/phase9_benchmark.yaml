name: phase_9_offline_synthetic_intervention_selection_benchmark
version: 0.9.0
random_seed: 309000
foundation_group_count: 75
population_size: 75
final_population_size: 150
foundation_seeds: [309101, 309102, 309103, 309104, 309105, 309106, 309107, 309108, 309109, 309110]
population_seeds: [309201, 309202, 309203, 309204, 309205, 309206, 309207, 309208, 309209, 309210]
